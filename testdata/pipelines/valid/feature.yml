# yaml-language-server: $schema=../schema/pipeline.json
version: 1
description: Split a planned feature into stacked PRs and build each one
start: split

variables:
  ticket:
    from_brief: true
    prompt: "Which ticket is this feature for?"
    format: '^[A-Z]+-[0-9]+$'

defaults:
  on_error: check-in

steps:
  split:
    description: Break the brief into reviewable slices
    split: /split
    rules: .ship/rules/splitting.md
    model: opus
    effort: high
    review: true
    next:
      ok: build
      unclear: check-in

  build:
    description: Build each slice as a stacked PR
    fanout: slice
    mode: series
    stack: true
    advance_on: in-review
    on_child_stop: halt
    next:
      done: done
      failed: check-in

  check-in:
    ask: "{{brief.title}} stopped at {{came_from}}. What next?"
    show: [prev.handover]
    input: optional
    choices:
      retry: $came_from
      abandon: stop
