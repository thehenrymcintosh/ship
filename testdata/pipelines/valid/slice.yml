# yaml-language-server: $schema=../schema/pipeline.json
version: 1
description: Implement, review, verify and ship one slice as a PR
start: implement

workspace:
  branch: "{{parent.vars.ticket}}/{{slice.number}}-{{slice.key}}"

variables:
  test:   { value: make test }
  pr_url: { set_by: open-pr }

defaults:
  max_visits: 3
  when_exhausted: chef
  on_error: chef

steps:
  implement:
    agent: /implement
    session: continue
    next: review

  review:
    agent: /review mode=code
    model: opus
    next:
      pass: gate
      changes: implement
      stuck: chef

  gate:
    description: Clean tree and green tests
    run: |
      test -z "$(git status --porcelain)" || { echo "uncommitted changes left behind"; exit 1; }
      {{raw vars.test}}
    next:
      pass: open-pr
      fail: implement

  open-pr:
    run: |
      git push --force-with-lease -u origin {{run.branch}}
      gh pr view {{run.branch}} --json url -q .url 2>/dev/null \
        || gh pr create --draft --base {{run.base}} --head {{run.branch}} \
             --title "{{parent.vars.ticket}}: {{slice.title}}" --body-file {{brief.path}}
    save:
      pr_url: last_line
    next:
      pass: pr-review
      fail: chef

  pr-review:
    agent: /pr-review pr={{vars.pr_url}}
    next:
      pass: ready
      changes: implement
      stuck: chef

  ready:
    run: gh pr ready {{vars.pr_url}} || true
    next: at-pass

  at-pass:
    description: Waiting for review on the PR
    wait: .ship/bin/pr-status {{vars.pr_url}}
    every: 5m
    timeout: 14d
    max_visits: 20
    next:
      comments: triage
      merged: done

  triage:
    agent: /triage pr={{vars.pr_url}}
    next:
      fix: unready
      nothing: at-pass
      design: chef
      intent: chef

  unready:
    run: gh pr ready --undo {{vars.pr_url}}
    next: implement

  chef:
    ask: "{{slice.title}} stopped at {{came_from}}. What next?"
    show: [prev.handover]
    input: optional
    choices:
      retry: $came_from
      rework: implement
      back to the pass: at-pass
      abandon: stop
