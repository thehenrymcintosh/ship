# Release archives and checksums to GitHub Releases on every v* tag.
# install.sh and `ship update` download these.
version: 2
project_name: ship
builds:
  - main: ./cmd/ship
    binary: ship
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/thehenrymcintosh/ship/internal/brand.Version={{.Version}}
archives:
  - formats: [tar.gz]
    files: [README.md]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
